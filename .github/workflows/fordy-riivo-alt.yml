#!/bin/bash

set -e

VERSION="$1"
TAG_NAME="$2"

# Setup paths
WSZST="./wszst/wszst"
WBMGT="./wszst/wbmgt"
WSTRT="./wszst/wstrt"  # <--- Neues Tool für Layouts

if [ -z "$VERSION" ] || [ -z "$TAG_NAME" ]; then
  echo "Error: Missing arguments. Usage: ./script.sh <VERSION> <TAG>"
  exit 1
fi

# Tools check
if [ ! -f "$WSZST" ] || [ ! -f "$WBMGT" ] || [ ! -f "$WSTRT" ]; then
  echo "Error: Local tools (wszst, wbmgt, wstrt) not found in ./wszst/"
  exit 1
fi

echo "Starting Advanced UI Build: $VERSION ($TAG_NAME)"

# Clean & Prep
rm -rf workdir
mkdir -p workdir

# 1. Download
echo "Downloading RetroRewind..."
wget -q http://update.rwfc.net:8000/RetroRewind/zip/RetroRewind.zip -O workdir/RetroRewind.zip
unzip -q workdir/RetroRewind.zip -d workdir/content

TARGET_DIR="workdir/content/RetroRewind6/Language/GER"

# Function to patch colors (Case insensitive search)
patch_color() {
    # Args: File, SearchHex, ReplaceHex
    # Search for hex string, replace ignoring case
    perl -pi -e "s/$2/$3/gi" "$1"
}

# 2. Process SZS Files
find "$TARGET_DIR" -name "*.szs" | while read szs_file; do
  FILENAME=$(basename "$szs_file")
  echo "Processing: $FILENAME"
  
  # Extract
  $WSZST extract "$szs_file" --dest "workdir/temp_szs" --quiet --overwrite
  
  # --- A. TEXT PATCHING (.bmg) via WBMGT ---
  find "workdir/temp_szs" -name "*.bmg" | while read bmg_file; do
    echo "  [Text] Patching $bmg_file"
    $WBMGT decode "$bmg_file" --dest "workdir/temp_msg.txt" --quiet --overwrite
    perl -pi -e 's/\bDaisy\b/Steve/g' "workdir/temp_msg.txt"
    perl -pi -e 's/Mach-Bike/KFC-Mofa/g' "workdir/temp_msg.txt"
    $WBMGT encode "workdir/temp_msg.txt" --dest "$bmg_file" --quiet --overwrite
    rm "workdir/temp_msg.txt"
  done

  # --- B. UI COLOR PATCHING (.brlyt & .brlan) via WSTRT ---
  # WSTRT converts binary layouts to a text format (not pure XML, but readable)
  
  find "workdir/temp_szs" -name "*.brlyt" -o -name "*.brlan" | while read lyt_file; do
    echo "  [UI] Patching: $(basename "$lyt_file")"
    
    TXT_FILE="${lyt_file}.txt"
    
    # Decode using WSTRT (Force overwrite)
    $WSTRT decode "$lyt_file" --dest "$TXT_FILE" --quiet --overwrite
    
    # 1. Global White to Orange
    # We search for FFFFFFFF (White) and replace with FFA500FF (Orange)
    # Note: Wiimms dumps often use hex like "FFFFFFFF" or "ffffffff"
    patch_color "$TXT_FILE" "FFFFFFFF" "FFA500FF"
    
    # 2. Red Mii Name logic (Specific Pane targeting in WSTRT text format)
    # WSTRT Text format looks like: pane { name="T_name" ... }
    if [[ "$FILENAME" == *"Race"* ]] || [[ "$FILENAME" == *"Global"* ]]; then
        # Look for block starting with name="T_...name..." and replace color inside until closing brace
        perl -pi -e 'if (/name\s*=\s*"T_.*(name|mii|player)"/i ... /^\s*}/) { s/FFFFFFFF/FF0000FF/gi }' "$TXT_FILE"
    fi

    # Encode back using WSTRT
    $WSTRT encode "$TXT_FILE" --dest "$lyt_file" --quiet --overwrite
    rm "$TXT_FILE"
  done

  # Repack SZS
  $WSZST create "workdir/temp_szs" --dest "$szs_file" --overwrite --quiet
  rm -rf "workdir/temp_szs"
done

# 3. Create ZIP
echo "Creating Release ZIP..."
cd workdir/content
ZIP_NAME="Fordy-RR-UI-Mod-${TAG_NAME}.zip"
zip -r -q "../../$ZIP_NAME" .
cd ../..

echo "artifact_path=$ZIP_NAME" >> $GITHUB_OUTPUT