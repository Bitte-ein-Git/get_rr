name: 🗿 Fordy-RR Riivolution Builder

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Riivolution Branch
        uses: actions/checkout@v4
        with:
          ref: Riivolution

      - name: 🔍 Check Version & Tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch latest version from text file
          REMOTE_VERSION=$(curl -s http://update.rwfc.net:8000/RetroRewind/RetroRewindVersion.txt | tail -n 1 | awk '{print $1}')
          TAG_NAME="RR-riivo_${REMOTE_VERSION}"
          
          echo "Detected RR Version: $REMOTE_VERSION"
          
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Skipping."
            echo "run_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected. Starting build."
            echo "run_build=true" >> $GITHUB_OUTPUT
            echo "version=$REMOTE_VERSION" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: 🛠️ Setup Tools & Env
        if: steps.check.outputs.run_build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip perl libarchive-tools
          
          # Make tools executable
          chmod +x wszst/wszst
          chmod +x wszst/wbmgt
          chmod +x builder/build-updates.sh

          # Add wszst to PATH
          echo "${{ github.workspace }}/wszst" >> $GITHUB_PATH

      - name: 🏗️ Run Build Script
        if: steps.check.outputs.run_build == 'true'
        id: build
        run: |
          # Execute new update build script
          ./builder/build-updates.sh "${{ steps.check.outputs.version }}" "${{ github.workspace }}"

      - name: 🚀 Create Release
        if: steps.check.outputs.run_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.check.outputs.tag_name }}
          name: 🗿 Fordy-RR • Riivolution (${{ steps.check.outputs.version }})
          files: |
            Fordy-RR-*.zip
            UPDATE-Fordy-RR-*.zip
          target_commitish: Riivolution
          body: |
            🗿 **Auto-Generated Build**
            
            Based on upstream version: `${{ steps.check.outputs.version }}`
            
            **Includes:**
            - `Fordy-RR-${{ steps.check.outputs.version }}.zip`: Complete Package
            - `Fordy-RR-${{ steps.check.outputs.version }}-PATCH_ONLY.zip`: Only modified files (Text, XML, MyStuff)
            - `UPDATE-Fordy-RR-*.zip`: All patches for this version series
            
            **Modified 'GER' lang text (via MyStuff):**
            - 🏍️ Mach-Bike -> KFC-Mofa
            - 👤 Daisy -> Steve

            [⬇️ Download](https://api.heyfordy.de/dl?rr_riivo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}