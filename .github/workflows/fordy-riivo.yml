name: 🗿 Fordy-RR Riivolution Builder

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Riivolution Branch
        uses: actions/checkout@v4
        with:
          ref: Riivolution

      - name: 🔍 Check Version & Tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch remote version from API
          REMOTE_VERSION=$(curl -s https://api.heyfordy.de/rr_app/version-rr | jq -r '.version')
          TAG_NAME="RR-riivo_${REMOTE_VERSION}"
          
          echo "Detected API Version: $REMOTE_VERSION"
          
          # Check if release already exists
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Skipping."
            echo "run_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected. Starting build."
            echo "run_build=true" >> $GITHUB_OUTPUT
            echo "version=$REMOTE_VERSION" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: 🛠️ Setup Tools & Env
        if: steps.check.outputs.run_build == 'true'
        run: |
          # Install dependencies
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip zip perl
          
          # Make tools executable
          chmod +x wszst/wszst
          chmod +x wszst/wbmgt
          chmod +x builder/fordy-riivo.sh

          # Add wszst directory to system PATH
          echo "${{ github.workspace }}/wszst" >> $GITHUB_PATH

      - name: 🏗️ Run Build Script
        if: steps.check.outputs.run_build == 'true'
        id: build
        run: |
          # Execute build script
          ./builder/fordy-riivo.sh "${{ steps.check.outputs.version }}"

      - name: 🚀 Create Release
        if: steps.check.outputs.run_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.check.outputs.tag_name }}
          name: 🗿 Fordy-RR • Riivolution (${{ steps.check.outputs.version }})
          files: ${{ steps.build.outputs.artifact_path }}
          target_commitish: Riivolution
          body: |
            🗿 **Auto-Generated Build**
            
            Based on upstream version: `${{ steps.check.outputs.version }}`
            
            **Modified 'GER' lang text (for MyStuff):**
            - 🏍️ Mach-Bike -> KFC-Mofa
            - 👤 Daisy -> Steve

            [⬇️ Download](https://api.heyfordy.de/dl?rr_riivo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}