name: "» 🌀 Build RetroRewind ISO 🇪🇺"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "📦 Checkout repository"
        uses: actions/checkout@v4

      - name: "🔎 Cache last known version"
        id: cache-version
        uses: actions/cache@v4
        with:
          path: .cache/last_version.txt
          key: ${{ runner.os }}-retrorewind-version

      - name: "🔄 Check for new version"
        id: check_update
        run: |
          mkdir -p .cache
          VERSION_URL="http://update.rwfc.net:8000/RetroRewind/RetroRewindVersion.txt"
          LATEST_VERSION_FILE=".cache/latest_version.txt"
          CACHED_VERSION_FILE=".cache/last_version.txt"
          
          if ! curl -sS --fail "$VERSION_URL" -o "$LATEST_VERSION_FILE"; then
            echo "::error::Failed to download version file from $VERSION_URL"
            exit 1
          fi
          
          LATEST_VERSION=$(cat "$LATEST_VERSION_FILE")
          echo "Latest remote version: $LATEST_VERSION"
          
          if [ -f "$CACHED_VERSION_FILE" ] && [ "$(cat "$CACHED_VERSION_FILE")" = "$LATEST_VERSION" ]; then
            echo "No new version detected. Nothing to do."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected ($LATEST_VERSION). Starting build process."
            echo "$LATEST_VERSION" > "$CACHED_VERSION_FILE"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: "🔧 Install dependencies and setup WIT"
        if: steps.check_update.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget unzip python3
          chmod +x wit/*
          echo "${{ github.workspace }}/wit" >> $GITHUB_PATH

      - name: "✅ Verify WIT installation"
        if: steps.check_update.outputs.changed == 'true'
        run: |
          wit --version

      - name: "🛠️ Setup build directory"
        if: steps.check_update.outputs.changed == 'true'
        run: |
          mkdir -p RR_workdir
          cp -r builder/* RR_workdir/

      - name: "🏁 Download and unpack RetroRewind"
        if: steps.check_update.outputs.changed == 'true'
        run: |
          wget http://update.rwfc.net:8000/RetroRewind/zip/RetroRewind.zip -P RR_workdir/
          unzip -o RR_workdir/RetroRewind.zip -d RR_workdir/

      - name: "💿 Download Mario Kart Wii ISO"
        if: steps.check_update.outputs.changed == 'true'
        run: |
          echo "Downloading Mario Kart Wii (PAL)... this will take a while."
          wget -q --show-progress "${{ secrets.ISO_PAL }}" -O RR_workdir/MKW_PAL.iso

      - name: "✏️ Generate copy-files.sh from XML"
        if: steps.check_update.outputs.changed == 'true'
        run: |
          python3 -c '
          import os
          import xml.etree.ElementTree as ET

          base_dir = "RR_workdir"
          xml_file = os.path.join(base_dir, "RetroRewind6", "xml", "RetroRewind6.xml")
          template_sh = os.path.join(base_dir, "copy-files.sh")
          
          print(f"Reading XML: {xml_file}")
          print(f"Updating script: {template_sh}")

          with open(template_sh, "r") as f:
              preserved_lines = [line.strip() for line in f if " ./extra/" in line]

          tree = ET.parse(xml_file)
          root = tree.getroot()
          
          generated_lines = []
          for node in root.findall(".//*[@external][@disc]"):
              ext = node.attrib["external"].lstrip("/")
              disc = node.attrib["disc"]
              
              source_ln_path = f"./{ext}"
              dest_ln_path = f"./workdir.tmp/files{disc}"

              generated_lines.append(f"ln -f {source_ln_path} {dest_ln_path}")

          final_lines = generated_lines + preserved_lines
          
          with open(template_sh, "w") as f:
              f.write("#!/bin/sh\n")
              f.write("# (c) 2012-09-25, by Wiimm\n")
              f.write("# auto-generated by github action from xml\n\n")
              f.write("\n".join(final_lines))
              f.write("\n")

          print(f"Generated {len(generated_lines)} + preserved {len(preserved_lines)} commands in {template_sh}")
          '
      - name: "🏗️ Build the ISO"
        if: steps.check_update.outputs.changed == 'true'
        run: |
          chmod +x RR_workdir/*.sh
          cd RR_workdir && bash ./create-pal.sh

      - name: "🚀 Create GitHub Release"
        if: steps.check_update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat RR_workdir/RetroRewind6/version.txt | tr -d "[:space:]")
          TAG="v${VERSION}"
          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"
          gh release create "$TAG" --title "🏎️ ISO Release $TAG" --notes "Automated build for RetroRewind version $VERSION." "RR_workdir/new-image/"*